<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:25px;
    border-radius:10px;
    width:350px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

.input-section{
    display:flex;
    margin-bottom:15px;
}

input{
    flex:1;
    padding:8px;
    font-size:16px;
}

button{
    padding:8px 12px;
    margin-left:5px;
    background:#28a745;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:10px;
    background:#eee;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete{
    background:red;
    border:none;
    color:white;
    padding:5px 8px;
    cursor:pointer;
}

.delete:hover{
    background:darkred;
}

</style>
</head>

<body>

<div class="container">

<h2>To-Do List</h2>

<div class="input-section">
<input type="text" id="taskInput" placeholder="Enter a task">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<script>

function addTask(){

    let input = document.getElementById("taskInput");
    let task = input.value;

    if(task === ""){
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");
    li.textContent = task;

    let deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete";

    deleteBtn.onclick = function(){
        li.remove();
    }

    li.appendChild(deleteBtn);

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
