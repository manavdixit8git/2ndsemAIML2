<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Society Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #74ebd5, #9face6);
        min-height: 100vh;
      }
      header {
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        text-align: center;
        padding: 20px;
        font-size: 30px;
        letter-spacing: 1px;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px;
        flex-wrap: wrap;
      }
      nav button {
        padding: 12px 20px;
        border: none;
        border-radius: 25px;
        background: #ffffff22;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      nav button:hover {
        background: #fff;
        color: #333;
        transform: scale(1.05);
      }
      .container {
        padding: 20px;
        max-width: 1000px;
        margin: auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
        margin: 20px 0;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      h2 {
        margin-bottom: 10px;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
      }
      button.submit {
        background: #27ae60;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }
      button.submit:hover {
        background: #219150;
      }
      .notice {
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        background: #2980b9;
        color: white;
        animation: fadeIn 0.5s ease-in;
      }
      .chat-box {
        height: 250px;
        overflow-y: auto;
        background: #f1f1f1;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .chat-msg {
        background: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        margin: 5px 0;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <header>🏡 Smart Society Portal</header>

    <nav>
      <button onclick="showSection('home')">🏠 Home</button>
      <button onclick="showSection('complaint')">📢 Complaint</button>
      <button onclick="showSection('chat')">💬 General Chat</button>
      <button onclick="showSection('admin')">⚙️ Committee</button>
    </nav>

    <div class="container">
      <!-- HOME -->
      <div id="home">
        <div class="card">
          <h2>📌 Notice Board</h2>
          <div id="notices"></div>
        </div>
      </div>

      <!-- COMPLAINT -->
      <div id="complaint" style="display: none">
        <div class="card">
          <h2>📢 Register Complaint</h2>
          <input type="text" id="name" placeholder="Your Name" />
          <textarea
            id="complaintText"
            placeholder="Write your complaint..."
          ></textarea>
          <button class="submit" onclick="addComplaint()">Submit</button>
        </div>
        <div class="card">
          <h2>📋 Complaints</h2>
          <div id="complaints"></div>
        </div>
      </div>

      <!-- GENERAL CHAT -->
      <div id="chat" style="display: none">
        <div class="card">
          <h2>💬 Society Chat</h2>
          <div class="chat-box" id="chatBox"></div>
          <input type="text" id="chatInput" placeholder="Type message..." />
          <button class="submit" onclick="sendMessage()">Send</button>
        </div>
      </div>

      <!-- ADMIN -->
      <div id="admin" style="display: none">
        <div class="card">
          <h2>⚙️ Post Notice</h2>
          <textarea id="noticeText" placeholder="Write notice..."></textarea>
          <button class="submit" onclick="addNotice()">Post</button>
        </div>
      </div>
    </div>

    <script>
      let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
      let notices = JSON.parse(localStorage.getItem("notices")) || [];
      let chats = JSON.parse(localStorage.getItem("chats")) || [];

      function showSection(section) {
        ["home", "complaint", "chat", "admin"].forEach((id) => {
          document.getElementById(id).style.display = "none";
        });
        document.getElementById(section).style.display = "block";
      }

      function addComplaint() {
        let name = document.getElementById("name").value;
        let text = document.getElementById("complaintText").value;
        if (name && text) {
          complaints.push({ name, text });
          localStorage.setItem("complaints", JSON.stringify(complaints));
          displayComplaints();
        }
      }

      function displayComplaints() {
        let box = document.getElementById("complaints");
        box.innerHTML = "";
        complaints.forEach((c) => {
          box.innerHTML += `<div class='card'><b>${c.name}</b><p>${c.text}</p></div>`;
        });
      }

      function addNotice() {
        let text = document.getElementById("noticeText").value;
        if (text) {
          notices.unshift(text);
          localStorage.setItem("notices", JSON.stringify(notices));
          displayNotices();
        }
      }

      function displayNotices() {
        let box = document.getElementById("notices");
        box.innerHTML = "";
        notices.forEach((n) => {
          box.innerHTML += `<div class='notice'>${n}</div>`;
        });
      }

      function sendMessage() {
        let input = document.getElementById("chatInput");
        if (input.value) {
          chats.push(input.value);
          localStorage.setItem("chats", JSON.stringify(chats));
          displayChats();
          input.value = "";
        }
      }

      function displayChats() {
        let box = document.getElementById("chatBox");
        box.innerHTML = "";
        chats.forEach((m) => {
          box.innerHTML += `<div class='chat-msg'>${m}</div>`;
        });
        box.scrollTop = box.scrollHeight;
      }

      // load

      displayComplaints();
      displayNotices();
      displayChats();
    </script>
  </body>
</html>
